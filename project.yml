name: LifeBook
options:
  bundleIdPrefix: com.lifebook
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  LifeBook:
    type: application
    platform: iOS
    sources:
      - path: LifeBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifebook.app
        PRODUCT_NAME: LifeBook
        INFOPLIST_KEY_CFBundleDisplayName: LifeBook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用 Face ID 保护你的私人记录
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - LifeBookTests
        - LifeBookUITests
  LifeBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeBookTests
    dependencies:
      - target: LifeBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifebook.tests
        GENERATE_INFOPLIST_FILE: true
  LifeBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LifeBookUITests
    dependencies:
      - target: LifeBook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifebook.uitests
        GENERATE_INFOPLIST_FILE: true
