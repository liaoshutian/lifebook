name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch

      - name: Ensure iOS Simulator runtime
        run: |
          if ! xcrun simctl list runtimes available | grep -q 'iOS'; then
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes available
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          xcodebuild -list -project LifeBook.xcodeproj

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LifeBook.xcodeproj \
            -scheme LifeBook \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            | tee xcodebuild.log

      - name: Export code coverage
        if: always() && hashFiles('TestResults.xcresult/**') != ''
        continue-on-error: true
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            coverage.json
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
